services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: metadata
      POSTGRES_DB: metadata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata -d metadata"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://metadata:metadata@db:5432/metadata
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: metadata
      POSTGRES_DB: metadata_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata -d metadata_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  test:
    build: ./backend
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://metadata:metadata@test-db:5432/metadata_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["pytest", "-q"]
volumes:
  postgres_data:
